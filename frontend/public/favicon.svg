<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="batteryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Battery body -->
  <rect x="20" y="30" width="50" height="40" rx="4" fill="url(#batteryGradient)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Battery terminal -->
  <rect x="70" y="42" width="6" height="16" rx="2" fill="#1E293B"/>
  
  <!-- Lightning bolt -->
  <path d="M 45 40 L 50 50 L 45 50 L 55 60 L 50 50 L 55 50 Z" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Energy lines -->
  <circle cx="35" cy="50" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="55" cy="50" r="3" fill="#FFFFFF" opacity="0.6"/>
</svg>
