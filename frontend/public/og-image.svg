<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0FDF4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="batteryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="100" fill="#3B82F6" opacity="0.1"/>
  <circle cx="1000" cy="480" r="120" fill="#10B981" opacity="0.1"/>
  
  <!-- Main battery icon -->
  <g transform="translate(400, 200)">
    <!-- Battery body -->
    <rect x="0" y="0" width="200" height="120" rx="12" fill="url(#batteryGradient)" stroke="#1E293B" stroke-width="4"/>
    
    <!-- Battery terminal -->
    <rect x="200" y="40" width="20" height="40" rx="4" fill="#1E293B"/>
    
    <!-- Lightning bolt -->
    <path d="M 80 30 L 100 60 L 80 60 L 120 90 L 100 60 L 120 60 Z" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Energy indicators -->
    <circle cx="50" cy="60" r="8" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="150" cy="60" r="8" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="420" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" fill="#1E293B" text-anchor="middle">
    Battery Scout
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="480" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="500" fill="#475569" text-anchor="middle">
    Global Battery Industry Intelligence
  </text>
  
  <!-- Tagline -->
  <text x="600" y="530" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400" fill="#64748B" text-anchor="middle">
    Daily insights for battery professionals
  </text>
</svg>
